<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy</title>
    <script defer src="main.js"></script>
    <script src="https://unpkg.com/jsonc-parser/lib/umd/main.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="error" style="display: none"></div>

    <div class="game" id="game">
        <div id="game-title"></div>
        <div class="board" id="board"></div>
        <div id="scoreboard"></div>
        <div id="controls-container">
            <button id="btn-reset">Reset</button>
            <select id="points-handler-select"></select>
            <input id="points-handler-input">
            <button id="points-handler-submit">Submit</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-container">
            <div id="modal-info">
                <div id="modal-category">NULL</div>
                <div id="modal-value">NULL</div>
            </div>
            <div id="modal">
                <div id="question-section">
                    <div id="modal-question-text"></div>
                </div>
                <div id="modal-audio-container"></div>
                <div id="modal-image-container"></div>
                <div id="modal-content">
                    <p id="modal-answer-text"></p>
                </div>
            </div>
            <div id="modal-controls">
                <button id="reveal-btn">Reveal</button>
                <button id="close-btn">Close</button>
            </div>
        </div>
    </div>
</body>
</html>
