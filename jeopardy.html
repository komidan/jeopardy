<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy</title>
    <script defer src="main.js"></script>
    <script src="https://unpkg.com/jsonc-parser/lib/umd/main.js"></script>
    <style>
        :root {
            --thm_bg_status: #3c383c;
            --thm_bg_dim:    #252423;
            --thm_bg:        #32302f;
            --thm_bg1:       #3c3836;
            --thm_bg2:       #504945;
            --thm_bg3:       #5a524e;
            --thm_bg4:       #665c54;
            --thm_term_bg:   #1d2021;
            --thm_bg_alt:    #3c3836;
            --thm_fg_dim:    #a89984;
            --thm_fg:        #ddc7a1;
            --thm_red:       #ea6962;
            --thm_orange:    #e78a4e;
            --thm_yellow:    #d8a657;
            --thm_green:     #a9b665;
            --thm_aqua:      #89b482;
            --thm_blue:      #7daea3;
            --thm_purple:    #d3869b;
        }


        body {
            min-height: 100vh;
            justify-content: center;
            background: var(--thm_bg);
            font-size: 24pt;
            margin: 0;
            color: var(--thm_fg);
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ── All buttons: no background, just a border and text ── */
        button, select, input {
            padding: 8px 14px;
            border: 4px solid var(--thm_bg4);
            color: var(--thm_fg);
            font-size: 16pt;
            font-family: monospace;
            background: none;
            margin: 4px 0;
            cursor: crosshair;
            transition: border-color 0.15s, color 0.15s, background 0.4s ease;
        }
        button:active {
            background: var(--thm_bg3);
            transition: none;
        }
        button:hover {
            border-color: var(--thm_yellow);
            color: var(--thm_yellow);
        }
        button:disabled {
            color: var(--thm_bg4);
        }
        input:focus {
            outline: none;
            background: var(--thm_bg2);
        }
        input:hover,
        select:hover {
            border: 4px solid var(--thm_yellow);
            transition: border-color 0.15s, color 0.15s;
        }

        #game-title {
            margin-top: 4px;
            width: auto;
            font-size: 32pt;
            border: 4px solid var(--thm_bg2);
            padding: 12px 18px;
            text-align: center;
            user-select: none;
        }

        /* ── Error toast ── */
        #error {
            display: block;
            position: fixed;
            padding: 12px;
            top: 1vh;
            right: 0.5vw;
            background: var(--thm_bg1);
            border: 4px solid var(--thm_red);
            border-radius: 4px;
            color: var(--thm_red);
        }

        /* ── Board outer wrapper ── */
        #board {
            margin-top: 4px;
            display: block;
            width: 80vw;
            text-align: center;
            border: 2px solid var(--thm_bg4);
            max-width: 40vw;
            padding: 0;
            z-index: 0;
        }

        /* ── Board table cells (JS is expected to render a <table>) ── */
        #board table {
            border-collapse: collapse;
            table-layout: fixed;
            width: 100%;
        }
        #board th,
        #board td {
            border: 4px solid var(--thm_bg4);
            padding: 0;
            width: 0;
        }
        #board th {
            background: var(--thm_bg2);
            color: var(--thm_yellow);
            padding: 10px 16px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            user-select: none;
        }
        #board td {
            background: var(--thm_bg1);
        }

        /* ── Cell buttons inside the board ── */
        #board button {
            height: 12vh;
            background: none;
            border: none;
            padding: 32px;
            margin: 0;
            width: 100%;
            font-size: 24pt;
            font-weight: bold;
            cursor: crosshair;
            transition: background 0.15s, color 0.15s;
        }
        #board button:hover {
            background: var(--thm_bg3);
        }
        #board button:disabled,
        #board button.used {
            background: var(--thm_bg);
            color: var(--thm_bg2) !important;
            cursor: default;
        }

        /* Modal */
        #modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(29, 32, 33, 0.88);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #modal {
            min-height: 25vh;
            min-width: 25vw;
            display: flex;
            flex-direction: column;
            max-width: 700px;
            background: var(--thm_bg1);
            border: 4px solid var(--thm_bg4);
            justify-content: center;
            align-items: center;
        }
        #modal-info {
            display: flex;
            flex-direction: row;
            width: 100%;
            margin-bottom: 4px;
        }
        #modal-info div {
            flex: 1;
            font-size: 24pt;
            padding: 12px;
            text-align: center;
            border: 4px solid var(--thm_bg4);
            background: var(--thm_bg);
            transition: background 0.20s ease;
        }
        #modal-value {
            font-size: 18pt;
            color: var(--thm_yellow);
            font-weight: bold;
        }
        #modal-category {
            font-size: 11pt;
            color: var(--thm_fg_dim);
            text-transform: uppercase;
            margin-right: 4px;
        }
        #modal-answer-text {
            font-size: 20pt;
            line-height: 1.4;
            color: var(--thm_fg);
            margin: 0;
            display: none;
        }
        #modal-answer-img {
            max-width: 100%;
            max-height: 280px;
            border: 2px solid var(--thm_bg4);
            display: none;
        }
        #modal-question-text {
            font-size: 20pt;
            color: var(--thm_orange);
            line-height: 1.4;
        }
        #modal-controls {
            display: flex;
            flex-direction: row;
            width: 100%;
        }
        #modal-controls button {
            flex: 1;
            font-size: 18pt;
            padding: 12px;
            border: 4px solid var(--thm_bg4);
            background: var(--thm_bg);
            transition: background 0.20s ease;
        }
        #modal-controls button:hover {
            background: var(--thm_bg_alt);
            transition: none;
        }
        #close-btn {
            color: var(--thm_red);
            margin-left: 4px;
        }
        #reveal-btn {
            color: var(--thm_aqua);
        }

        /* Score */
        #scoreboard {
            margin-top: 4px;
        }
        .score-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .score-btn {
            font-size: 13pt;
        }
        .score-btn.correct {
            color: var(--thm_green);
            border-color: var(--thm_green);
        }
        .score-btn.correct:hover {
            color: var(--thm_yellow);
            border-color: var(--thm_yellow);
        }
        .score-btn.wrong {
            color: var(--thm_red);
            border-color: var(--thm_red);
        }
        .score-btn.wrong:hover {
            color: var(--thm_yellow);
            border-color: var(--thm_yellow);
        }

        /* Controller */
        #controls-container {
            display: flex;
            flex-direction: row;
            margin: 0;
            padding: 0;
            gap: 4px;
        }
        #controls-container button, input, select {
            margin: 0;
        }
        #points-handler-input {
            flex: 1 0 auto;
        }
        #btn-reset:hover {
            color: var(--thm_red);
        }

        /* Scoreboard */
        #scoreboard {
            display: flex;
            gap: 0 4px;
            flex-direction: row;
            justify-content: center;
            margin-bottom: 4px;
        }
        .player-card {
            width: 100%;
            height: auto;
            display: flex;
            flex-direction: column;
            padding: 4px;
            align-items: center;
            border: 4px solid var(--thm_bg4);
            background: var(--thm_bg1);
        }
        .player-avatar {
            width: auto;
            height: auto;
            object-fit: cover;
            border: 4px solid var(--thm_bg4);
        }
        .player-name {
            margin: 2px;
            font-size: 12pt;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--thm_fg);
        }
        .player-score {
            font-size: 32pt;
            transition: color 0.5s
        }

    </style>
</head>
<body>
    <div id="error" style="display: none"></div>

    <div class="game" id="game">
        <div id="game-title"></div>
        <div class="board" id="board"></div>
        <div id="scoreboard"></div>
        <div id="controls-container">
            <select id="points-handler-select"></select>
            <input id="points-handler-input">
            <button id="points-handler-submit">Submit</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div id="modal-container">
            <div id="modal-info">
                <div id="modal-category">NULL</div>
                <div id="modal-value">NULL</div>
            </div>
            <div id="modal">
                <div id="question-section">
                    <div id="modal-question-text"></div>
                </div>
                <div id="modal-content">
                    <p id="modal-answer-text"></p>
                    <img id="modal-answer-img" alt="Answer" />
                </div>
            </div>
            <div id="modal-controls">
                <button id="reveal-btn">Reveal</button>
                <button id="close-btn">Close</button>
            </div>
        </div>
    </div>

</body>
</html>
